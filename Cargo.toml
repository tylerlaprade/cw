[package]
name    = "cw"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Numbered-workspace dev-CLI: worktree + services + restack + triage"

[[bin]]
name = "cw"
path = "src/main.rs"

[dependencies]
clap        = { version = "4.5", features = ["derive"] }
anyhow      = "1"
thiserror   = "1"
serde       = { version = "1", features = ["derive"] }
toml        = "0.8"
owo-colors  = "4"
inquire     = "0.7"
dotenvy     = "0.15"
tempfile    = "3"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xshell      = "0.2"
regex       = "1"
once_cell   = "1"
nix         = { version = "0.29", features = ["process", "signal", "fs"] }
terminal_size = "0.4"

[dev-dependencies]
assert_cmd  = "2"
predicates  = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
